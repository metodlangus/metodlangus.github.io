/* CLOSE BUTTON */
.birthday-close {
  position:fixed;
  top:20px;
  right:20px;
  z-index:2147483647;
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial,sans-serif;
  font-size:28px;
  line-height:1;
  cursor:pointer;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .2s ease,background .2s ease,box-shadow .2s ease;
}

.birthday-close:hover {
  transform:scale(1.08);
  background:rgba(255,255,255,.16);
  box-shadow:0 10px 35px rgba(0,0,0,.4),0 0 25px rgba(255,120,190,.18);
}

.birthday-close:active {
  transform:scale(.94);
}

.birthday-close:focus-visible {
  outline:2px solid rgba(255,255,255,.8);
  outline-offset:3px;
}

.birthday-background,
.confetti {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.birthday-background { z-index:0; }

.birthday-glow {
  position:absolute;
  width:45vw;
  height:45vw;
  max-width:600px;
  max-height:600px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.25;
  animation:birthdayGlow 8s ease-in-out infinite alternate;
}

.birthday-glow.one {
  top:-15vw;
  left:-10vw;
  background:#ff77b7;
}

.birthday-glow.two {
  right:-15vw;
  bottom:-15vw;
  background:#9b7cff;
  animation-delay:-3s;
}

@keyframes birthdayGlow {
  from { transform:scale(.9); }
  to { transform:scale(1.15); }
}

.confetti { z-index:1; }

.confetti span {
  position:absolute;
  top:-30px;
  width:8px;
  height:16px;
  border-radius:2px;
  background:rgba(255,255,255,.8);
  animation:confettiFall linear infinite;
}

.confetti span:nth-child(1) { left:7%;animation-duration:7s;animation-delay:-2s;transform:rotate(20deg); }
.confetti span:nth-child(2) { left:18%;animation-duration:9s;animation-delay:-5s;transform:rotate(70deg); }
.confetti span:nth-child(3) { left:31%;animation-duration:6s;animation-delay:-1s;transform:rotate(120deg); }
.confetti span:nth-child(4) { left:44%;animation-duration:8s;animation-delay:-4s;transform:rotate(40deg); }
.confetti span:nth-child(5) { left:57%;animation-duration:7s;animation-delay:-3s;transform:rotate(90deg); }
.confetti span:nth-child(6) { left:69%;animation-duration:10s;animation-delay:-7s;transform:rotate(150deg); }
.confetti span:nth-child(7) { left:81%;animation-duration:6s;animation-delay:-2s;transform:rotate(30deg); }
.confetti span:nth-child(8) { left:93%;animation-duration:8s;animation-delay:-6s;transform:rotate(110deg); }

@keyframes confettiFall {
  0% { transform:translateY(-40px) rotate(0);opacity:0; }
  10% { opacity:1; }
  100% { transform:translateY(110vh) rotate(720deg);opacity:0; }
}

.birthday-page {

  z-index:2;

@keyframes birthdayHeroIn {

<script>
document.addEventListener('DOMContentLoaded', function () {
  var birthdayDate =
    new URLSearchParams(window.location.search).get('birthday');

  if (!birthdayDate) {
    return;
  }

  var parts = birthdayDate.split('-');

  var month = parseInt(parts[0], 10);
  var day = parseInt(parts[1], 10);

  if (
    !Number.isInteger(month) ||
    !Number.isInteger(day) ||
    month < 1 ||
    month > 12 ||
    day < 1 ||
    day > 31
  ) {
    return;
  }

  var today = new Date();

  today.setHours(0, 0, 0, 0);

  /* Birthday in the current year */
  var birthday = new Date(
    today.getFullYear(),
    month - 1,
    day
  );

  birthday.setHours(0, 0, 0, 0);

  /* Birthday has not happened yet */
  if (today < birthday) {
    return;
  }

  var daysSinceBirthday = Math.floor(
    (today - birthday) / 86400000
  );

  var text = 'Danes je poseben dan';

  if (daysSinceBirthday === 1) {
    text = 'Včeraj je bil poseben dan';
  } else if (daysSinceBirthday > 1) {
    text =
      daysSinceBirthday +
      ' dni nazaj je bil poseben dan';
  }

  var kickerText = document.getElementById(
    'birthday-kicker-text'
  );

  if (kickerText) {
    kickerText.textContent = text;
  }
});
</script>

<script>
function closeBirthdayPage() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage(
      { type:'birthday-close' },
      window.location.origin
    );
    return;
  }

  /* If opened directly, do not redirect. */
  if (window.history.length > 1) {
    window.history.back();
  }
}
</script>
